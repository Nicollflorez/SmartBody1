# Etapa 8: Prometheus recolecta las metricas que el backend expone en /actuator/prometheus
# (Spring Boot Actuator + Micrometer): peticiones HTTP, latencias, errores, JVM, pool de conexiones.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: smartbody-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          servicio: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
