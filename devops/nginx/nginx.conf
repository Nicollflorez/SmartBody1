# Nginx como proxy inverso de Smartbody (Etapa 7: operar).
# Unico punto de entrada publico: la app Android habla con http://<host>/ y Nginx reenvia al backend.
# En produccion se termina TLS aqui (certificado en /etc/nginx/certs y un bloque "listen 443 ssl").

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format smartbody '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_user_agent" $request_time s';
    access_log /var/log/nginx/access.log smartbody;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Compresion de las respuestas JSON.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Limite de peticiones por cliente (protege login y registro de fuerza bruta).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream smartbody_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Foto de perfil: el backend admite hasta 1 MB.
        client_max_body_size 2m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://smartbody_backend;
            include /etc/nginx/proxy_params_smartbody;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://smartbody_backend;
            include /etc/nginx/proxy_params_smartbody;
        }

        # Estado para balanceadores y monitoreo externo; el resto de /actuator queda interno.
        location = /actuator/health {
            proxy_pass http://smartbody_backend;
            include /etc/nginx/proxy_params_smartbody;
        }
        location /actuator/ {
            return 404;
        }

        location = / {
            return 200 '{"servicio":"Smartbody","entrada":"/api"}';
        }
    }
}
