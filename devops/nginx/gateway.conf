# Nginx como API gateway de los microservicios de Smartbody.
# Mismas rutas que el monolito: la app Android no cambia. Enruta por prefijo y bloquea /internal.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format smartbody '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_user_agent" $request_time s -> $upstream_addr';
    access_log /var/log/nginx/access.log smartbody;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream smartbody_auth     { server auth:8080;     keepalive 16; }
    upstream smartbody_planes   { server planes:8080;   keepalive 16; }
    upstream smartbody_progreso { server progreso:8080; keepalive 16; }
    upstream smartbody_admin    { server admin:8080;    keepalive 16; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Las rutas internas entre servicios nunca se exponen.
        location /internal/ {
            return 404;
        }

        # ---- auth: cuenta, sesion, perfil, foto, resumen de inicio ----
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://smartbody_auth;
            include /etc/nginx/proxy_params_smartbody;
        }
        location /api/users/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://smartbody_auth;
            include /etc/nginx/proxy_params_smartbody;
        }
        location = /api/ping {
            proxy_pass http://smartbody_auth;
            include /etc/nginx/proxy_params_smartbody;
        }

        # ---- planes: catalogos, rutinas y nutricion ----
        location ~ ^/api/(objectives|restrictions|exercises|routines|nutrition)(/|$) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://smartbody_planes;
            include /etc/nginx/proxy_params_smartbody;
        }

        # ---- progreso: medidas y chatbot ----
        location ~ ^/api/(progress|chat)(/|$) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://smartbody_progreso;
            include /etc/nginx/proxy_params_smartbody;
        }

        # ---- admin: panel de administracion ----
        location /api/admin/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://smartbody_admin;
            include /etc/nginx/proxy_params_smartbody;
        }

        # Estado de cada servicio para balanceadores y monitoreo externo.
        location = /actuator/health {
            proxy_pass http://smartbody_auth;
            include /etc/nginx/proxy_params_smartbody;
        }
        location /actuator/ {
            return 404;
        }

        location = / {
            return 200 '{"servicio":"Smartbody","arquitectura":"microservicios","entrada":"/api"}';
        }
    }
}
