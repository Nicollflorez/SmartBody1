server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: smartbody-admin
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

smartbody:
  jwt:
    issuer: smartbody-api
    keys-dir: ${SMARTBODY_KEYS_DIR:./keys}
  interno:
    token: ${SMARTBODY_INTERNAL_TOKEN:}
  servicios:
    auth: ${SMARTBODY_URL_AUTH:http://localhost:8081}
    planes: ${SMARTBODY_URL_PLANES:http://localhost:8082}
    progreso: ${SMARTBODY_URL_PROGRESO:http://localhost:8083}

logging:
  level:
    root: INFO
    com.smartbody: INFO
