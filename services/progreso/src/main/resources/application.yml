server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: smartbody-progreso

  datasource:
    url: jdbc:mysql://${SMARTBODY_DB_HOST:localhost}:${SMARTBODY_DB_PORT:3306}/${SMARTBODY_DB_NAME:smartbody_progreso}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${SMARTBODY_DB_USER:root}
    password: ${SMARTBODY_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

smartbody:
  jwt:
    issuer: smartbody-api
    keys-dir: ${SMARTBODY_KEYS_DIR:./keys}
  interno:
    token: ${SMARTBODY_INTERNAL_TOKEN:}
  servicios:
    auth: ${SMARTBODY_URL_AUTH:http://localhost:8081}
    planes: ${SMARTBODY_URL_PLANES:http://localhost:8082}

logging:
  level:
    root: INFO
    com.smartbody: INFO
    org.hibernate.SQL: WARN
