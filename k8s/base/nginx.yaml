# Etapa 7: Nginx como proxy inverso y unico punto de entrada (NodePort 30080).
# La configuracion es la misma que en docker-compose: devops/nginx/, cargada en el ConfigMap
# "smartbody-nginx" por k8s/desplegar.sh.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: smartbody
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: smartbody
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/proxy_params_smartbody
              subPath: proxy_params_smartbody
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: smartbody-nginx
