# kubectl apply -k k8s/base   (o k8s/desplegar.sh, que ademas crea los ConfigMaps y el Secret de claves)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartbody

resources:
  - namespace.yaml
  - secrets.yaml
  - mysql.yaml
  - backend.yaml
  - nginx.yaml
  - monitoreo.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: smartbody
