# Variante monolito: la infraestructura comun (k8s/comun) mas el backend de Spring Boot.
#   kubectl apply -k k8s/base   (o k8s/desplegar.sh, que ademas crea los ConfigMaps y el Secret de claves)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartbody

resources:
  - ../comun
  - backend.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: smartbody
