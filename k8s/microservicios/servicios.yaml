            - name: SMARTBODY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smartbody-interno
                  key: token
          volumeMounts:
            - name: clave-publica
              mountPath: /app/keys
              readOnly: true
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 72        # hasta 6 minutos: en un cluster pequeno arrancan 4 JVM a la vez
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
