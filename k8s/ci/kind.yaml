# Cluster efimero de kind que el pipeline crea para probar el despliegue real (job k8s:kind).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Con Docker-in-Docker el job no es "localhost": el API server debe escuchar en todas las interfaces.
  apiServerAddress: "0.0.0.0"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
