# Valores de desarrollo. En produccion se reemplazan con "kubectl create secret" o un gestor de secretos;
# nunca se suben valores reales al repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: smartbody-db
  namespace: smartbody
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: smartbody
---
apiVersion: v1
kind: Secret
metadata:
  name: smartbody-admin
  namespace: smartbody
type: Opaque
stringData:
  SMARTBODY_ADMIN_EMAIL: admin@smartbody.com
  SMARTBODY_ADMIN_PASSWORD: Smartbody-Admin-2026
---
apiVersion: v1
kind: Secret
metadata:
  name: smartbody-grafana
  namespace: smartbody
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: smartbody
