# Pipeline de lanzamiento de Smartbody en GitLab CI/CD (Etapa 5: gestion de lanzamientos).
#
# Fases: version -> build -> test -> package -> publish -> release.
#   - Cada push a main publica un SNAPSHOT en el Package Registry del proyecto (repositorio de artefactos).
#   - "Run pipeline" con el input publicar_release=true: compila la version oficial; el job "publish:release"
#     queda en espera de aprobacion manual (boton Play); al aprobarlo se publica, se etiqueta
#     vX.Y.Z y se crea el Release de GitLab con el jar y el apk, listos para la Etapa 6.
#
# Corre integramente en los runners de gitlab.com: no necesita Docker ni memoria del PC de desarrollo.
# Variable opcional del proyecto (Settings > CI/CD > Variables): GITLAB_PUSH_TOKEN (project access token
# con write_repository) para que el release haga el commit de version y la etiqueta.

# Opciones del formulario "Run pipeline" (Build > Pipelines > New pipeline > Inputs).
spec:
  inputs:
    publicar_release:
      type: boolean
      default: false
      description: "Publicar version oficial (sin -SNAPSHOT), etiquetarla y crear el Release"
    version_release:
      type: string
      default: ""
      description: "Version a liberar (ej. 1.0.0). Vacia: la del pom sin -SNAPSHOT"
    api_base_url:
      type: string
      default: "http://10.0.2.2:8080/"
      description: "URL del backend que se compila dentro del APK (BuildConfig.API_BASE_URL)"
---
stages: [version, build, test, package, docker, deploy, publish, release]

variables:
  PUBLICAR_RELEASE: "$[[ inputs.publicar_release ]]"
  VERSION_RELEASE: "$[[ inputs.version_release ]]"
  API_BASE_URL: "$[[ inputs.api_base_url ]]"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MVN: "./mvnw -B -ntp"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Repositorio de artefactos: Package Registry (Maven) de este proyecto.
  GITLAB_MAVEN_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/maven"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  interruptible: true

.backend:
  image: eclipse-temurin:17-jdk
  cache:
    key: maven
    paths: [.m2/repository]
  before_script:
    - cd backend

.android:
  image: ghcr.io/cirruslabs/android-sdk:36
  cache:
    key: gradle
    paths: [.gradle/caches, .gradle/wrapper]
  before_script:
    - cd android
    - chmod +x gradlew

# ---------------------------------------------------------------- version
version:
  stage: version
  extends: .backend
  script:
    - POM=$($MVN -q help:evaluate -Dexpression=project.version -DforceStdout)
    - |
      if [ "$PUBLICAR_RELEASE" = "true" ]; then
        VERSION="${VERSION_RELEASE:-${POM%-SNAPSHOT}}"; RELEASE=true
      else
        VERSION="$POM"; RELEASE=false
      fi
    # Un release no puede reutilizar una etiqueta: se comprueba aqui para fallar en el primer minuto.
    - |
      if [ "$RELEASE" = "true" ] && curl -sf -o /dev/null "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/v$VERSION"; then
        echo "ERROR: la etiqueta v$VERSION ya existe. Indica otra version en el input version_release."
        exit 1
      fi
    - echo "VERSION=$VERSION" >  ../version.env
    - echo "RELEASE=$RELEASE"  >> ../version.env
    - echo "Smartbody v$VERSION (release=$RELEASE)"
  artifacts:
    reports:
      dotenv: version.env

# ---------------------------------------------------------------- build
build:backend:
  stage: build
  extends: .backend
  needs: [version]
  script:
    - $MVN versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
    - $MVN -DskipTests compile
  artifacts:
    paths: [backend/target/classes, backend/pom.xml]
    expire_in: 1 day

build:android:
  stage: build
  extends: .android
  needs: [version]
  script:
    - ./gradlew --no-daemon assembleRelease
        -Psmartbody.apiBaseUrl="$API_BASE_URL"
        -Psmartbody.versionName=$VERSION
        -Psmartbody.versionCode=$CI_PIPELINE_IID
  artifacts:
    paths: [android/app/build/outputs/apk/release/*.apk]
    expire_in: 1 week

# ---------------------------------------------------------------- test
test:backend:
  stage: test
  extends: .backend
  needs: [version, build:backend]
  script:
    - $MVN test
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

test:android:
  stage: test
  extends: .android
  needs: [version]
  script:
    - ./gradlew --no-daemon testDebugUnitTest
        -Psmartbody.versionName=$VERSION -Psmartbody.versionCode=$CI_PIPELINE_IID
  artifacts:
    when: always
    reports:
      junit: android/app/build/test-results/testDebugUnitTest/TEST-*.xml

# ---------------------------------------------------------------- package
package:backend:
  stage: package
  extends: .backend
  needs: [version, build:backend, test:backend]
  script:
    - $MVN -DskipTests package
  artifacts:
    name: "smartbody-backend-$VERSION"
    paths: [backend/target/smartbody-backend-*.jar, backend/pom.xml]
    expire_in: 1 week

# ---------------------------------------------------------------- docker (Etapa 6)
# Construye la imagen del backend con el jar que paso las pruebas y la publica en el
# Container Registry del proyecto. Kaniko no necesita un demonio de Docker en el runner.
docker:backend:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: [version, package:backend]
  variables:
    IMAGEN: $CI_REGISTRY_IMAGE/backend
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - DESTINOS="--destination $IMAGEN:$VERSION"
    - if [ "$CI_COMMIT_BRANCH" = "main" ]; then DESTINOS="$DESTINOS --destination $IMAGEN:latest"; fi
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/backend"
        --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile"
        --build-arg JAR_FILE=target/smartbody-backend-$VERSION.jar
        --label org.opencontainers.image.version=$VERSION
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA
        $DESTINOS
    - 'echo "Imagen publicada: $IMAGEN:$VERSION"'

# ---------------------------------------------------------------- deploy (Etapas 6 y 7)
# Valida la configuracion de Nginx y los manifiestos de Kubernetes sin necesitar un cluster.
nginx:validate:
  stage: deploy
  image: nginx:1.27-alpine
  needs: []
  script:
    - cp devops/nginx/nginx.conf /etc/nginx/nginx.conf
    - cp devops/nginx/proxy_params_smartbody /etc/nginx/proxy_params_smartbody
    - echo "127.0.0.1 backend" >> /etc/hosts
    - nginx -t

k8s:validate:
  stage: deploy
  image: alpine/k8s:1.31.2
  needs: []
  script:
    - wget -qO- https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin
    - kubectl kustomize k8s/base > manifiestos.yaml
    - kubeconform -strict -summary -kubernetes-version 1.31.0 manifiestos.yaml
  artifacts:
    paths: [manifiestos.yaml]
    expire_in: 1 week

# Despliegue real en un cluster Kubernetes efimero (kind) dentro del runner: aplica k8s/desplegar.sh
# con la imagen recien publicada y comprueba la API a traves de Nginx.
k8s:kind:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  needs: [version, docker:backend, k8s:validate, nginx:validate]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    KIND_VERSION: v0.24.0
    KUBECTL_VERSION: v1.31.2
  before_script:
    - apk add --no-cache curl bash openssl
    - curl -sLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
  script:
    - kind create cluster --name smartbody --config k8s/ci/kind.yaml --wait 120s
    # El API server corre en el servicio "docker" (dind), no en localhost.
    - PUERTO=$(kubectl config view -o jsonpath='{.clusters[?(@.name=="kind-smartbody")].cluster.server}' | sed 's#.*:##')
    - kubectl config set-cluster kind-smartbody --server="https://docker:$PUERTO" --insecure-skip-tls-verify=true
    - kubectl config unset clusters.kind-smartbody.certificate-authority-data
    - kubectl get nodes
    - BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:$VERSION" BACKEND_REPLICAS=1 sh k8s/desplegar.sh
    # Prueba de humo a traves de Nginx (NodePort 30080 publicado en el host de dind).
    - curl -sf http://docker:30080/api/ping
    - curl -sf http://docker:30080/actuator/health
    - curl -s -o /dev/null -w "%{http_code}\n" http://docker:30080/api/users/me | grep -q 401
    - kubectl -n smartbody get pods -o wide
  after_script:
    - kind delete cluster --name smartbody || true

# ---------------------------------------------------------------- publish
# Sube exactamente el jar y el apk que pasaron las pruebas (no recompila).
.publicar:
  stage: publish
  extends: .backend
  needs: [version, package:backend, build:android, test:android]
  script:
    - $MVN -s ../devops/maven/settings.xml deploy:deploy-file
        -DrepositoryId=gitlab -Durl=$GITLAB_MAVEN_URL
        -DpomFile=pom.xml -Dfile=$(ls target/smartbody-backend-*.jar)
    - $MVN -s ../devops/maven/settings.xml deploy:deploy-file
        -DrepositoryId=gitlab -Durl=$GITLAB_MAVEN_URL
        -DgroupId=com.smartbody -DartifactId=smartbody-android -Dversion=$VERSION -Dpackaging=apk
        -Dfile=$(ls ../android/app/build/outputs/apk/release/*.apk)
    - echo "Publicado com.smartbody:smartbody-backend:$VERSION y smartbody-android:$VERSION en $GITLAB_MAVEN_URL"

publish:snapshot:
  extends: .publicar
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $PUBLICAR_RELEASE != "true"

# Aprobacion del lanzamiento: queda en pausa hasta que un responsable pulse Play.
publish:release:
  extends: .publicar
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $PUBLICAR_RELEASE == "true"
      when: manual
      allow_failure: false

# ---------------------------------------------------------------- release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [version, publish:release, package:backend, build:android]
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $PUBLICAR_RELEASE == "true"
  variables:
    GIT_DEPTH: 0
  script:
    # La imagen release-cli usa sh (Alpine): solo sintaxis POSIX en este script.
    - REF="$CI_COMMIT_SHA"
    - |
      if [ -n "$GITLAB_PUSH_TOKEN" ]; then
        apk add --no-cache git openjdk17-jre-headless >/dev/null
        MAYOR=${VERSION%%.*}; RESTO=${VERSION#*.}; MENOR=${RESTO%%.*}; PARCHE=${RESTO#*.}
        SIGUIENTE="$MAYOR.$MENOR.$((PARCHE + 1))-SNAPSHOT"
        git config user.name "GitLab CI"; git config user.email "ci@smartbody.local"
        (cd backend && ./mvnw -B -ntp -q versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false)
        git commit -am "Release v$VERSION"
        REF=$(git rev-parse HEAD)
        (cd backend && ./mvnw -B -ntp -q versions:set -DnewVersion=$SIGUIENTE -DgenerateBackupPoms=false)
        git commit -am "Siguiente version de desarrollo $SIGUIENTE"
        git push -o ci.skip "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main
      else
        echo "Sin GITLAB_PUSH_TOKEN: no se hace el commit de version; la etiqueta apunta al commit actual."
      fi
    - echo "REF=$REF" > release.env
    - |
      release-cli create --name "Smartbody v$VERSION" --tag-name "v$VERSION" --ref "$REF" \
        --description "Lanzamiento v$VERSION. Artefactos en el Package Registry, listos para la Etapa 6 (Docker/Kubernetes)." \
        --assets-link "{\"name\":\"smartbody-backend-$VERSION.jar\",\"url\":\"$GITLAB_MAVEN_URL/com/smartbody/smartbody-backend/$VERSION/smartbody-backend-$VERSION.jar\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"smartbody-android-$VERSION.apk\",\"url\":\"$GITLAB_MAVEN_URL/com/smartbody/smartbody-android/$VERSION/smartbody-android-$VERSION.apk\",\"link_type\":\"package\"}"
